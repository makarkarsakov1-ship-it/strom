name: Demo Balance tests and iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "sources.zip"
      - ".github/workflows/demo-balance-build.yml"

concurrency:
  group: demo-balance-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.SPM_GH_TOKEN || github.token }}
      SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
      SWIFT_SUPPRESS_WARNINGS: "YES"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tonkeeper source
        run: |
          mkdir -p work
          ditto -x -k sources.zip work
          ROOT="$(find work -maxdepth 4 -type d -name Keeper | head -1)"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install project toolchain
        uses: jdx/mise-action@v2
        with:
          install: true
          working_directory: ${{ github.workspace }}/work/Keeper

      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -30

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/work/Keeper/build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: demo-balance-spm-${{ runner.os }}-${{ hashFiles('sources.zip') }}
          restore-keys: |
            demo-balance-spm-${{ runner.os }}-

      - name: Resolve Swift packages with retries
        working-directory: ${{ github.workspace }}/work/Keeper
        run: |
          set -euo pipefail
          mkdir -p build/SourcePackages
          for attempt in 1 2 3; do
            echo "SwiftPM resolve attempt $attempt/3"
            if xcodebuild -resolvePackageDependencies \
              -project Keeper.xcodeproj -scheme App \
              -clonedSourcePackagesDirPath build/SourcePackages; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          echo "Swift package resolution failed after 3 attempts" >&2
          exit 1

      - name: Patch generated Swift imports for compiler compatibility
        working-directory: ${{ github.workspace }}/work/Keeper
        run: |
          set -euo pipefail
          test -d LocalPackages
          python3 - <<'PY'
          from pathlib import Path

          roots = Path("LocalPackages")
          replacements = {
              "@_spi(Generated) public import": "@_spi(Generated) import",
              "public import struct Foundation.": "import struct Foundation.",
              "public import Foundation.": "import Foundation.",
              "public import OpenAPIRuntime": "import OpenAPIRuntime",
          }
          changed = 0
          for path in roots.rglob("*.swift"):
              if "Sources" not in path.parts:
                  continue
              source = path.read_text()
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated)
                  changed += 1
          # Only the completion-handler call uses a non-optional controller.
          # Other dismiss calls in this file have optional controllers and must retain ?.
          import re
          stories = roots / "AppModules/Stories/Sources/Stories/Presenter/StoriesPresenter.swift"
          if not stories.is_file():
              raise SystemExit(f"Missing expected source file: {stories}")
          story_source = stories.read_text()
          pattern = r"(?m)^(\s*)storiesViewController\?\.dismiss\(animated: true, completion:"
          story_source, patched = re.subn(pattern, r"\1storiesViewController.dismiss(animated: true, completion:", story_source)
          if patched != 1:
              raise SystemExit(f"Expected exactly one non-optional StoriesPresenter completion call, patched {patched}")
          stories.write_text(story_source)
          print("Patched exactly one non-optional StoriesPresenter completion call")
          print(f"Patched generated imports in {changed} Swift files")
          PY
          echo "Remaining generated public imports:"
          grep -R -nE '(@_spi\(Generated\) public import|^public import (struct )?Foundation\.|^public import OpenAPIRuntime)' LocalPackages || true

      - name: Run DemoBalanceStore tests
        working-directory: ${{ github.workspace }}/work/Keeper
        run: make test_app TEST_ONLY=AppTests/DemoBalanceStoreTests

      - name: Run secure-mode integration tests
        working-directory: ${{ github.workspace }}/work/Keeper
        run: make test_app TEST_ONLY=AppTests/MultichainAssetsListSecureModeTests

      - name: Build unsigned iOS archive
        working-directory: ${{ github.workspace }}/work/Keeper
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperDebug \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tonkeeper-Demo.xcarchive" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_SUPPRESS_WARNINGS=YES

      - name: Upload unsigned archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tonkeeper-demo-unsigned-archive
          path: ${{ runner.temp }}/Tonkeeper-Demo.xcarchive
          if-no-files-found: error
          compression-level: 1
