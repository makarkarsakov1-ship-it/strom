name: Inspect iOS project

on:
  push:
    paths:
      - "sources.zip"
      - ".github/workflows/inspect-ios.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and inspect project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          ditto -x -k sources.zip extracted
          ROOT="$(find extracted -maxdepth 4 -type d -name Keeper | head -1)"
          test -n "$ROOT"

          # Preserve the full source tree as an artifact so it can be reviewed and patched.
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" keeper-source.zip

          {
            echo "=== TOOLCHAIN ==="
            xcodebuild -version
            swift --version
            echo
            echo "=== DEMO BALANCE IMPLEMENTATION SEARCH ==="
            grep -RInE "DemoBalance|demo.balance|balanceOverride|overrideBalance|mockBalance" "$ROOT" --include='*.swift' --include='*.yml' --include='*.yaml' || true
            echo
            echo "=== DEMO BALANCE SOURCE FILES ==="
            find "$ROOT" -type f \( -iname '*DemoBalance*' -o -iname '*Balance*Override*' \) | sort
            while IFS= read -r file; do
              echo
              echo "--- SOURCE: $file"
              sed -n '1,360p' "$file"
            done < <(find "$ROOT" -type f \( -iname '*DemoBalance*' -o -iname '*Balance*Override*' \) | sort)
            echo
            echo "=== APP TESTS MATCHING DEMO BALANCE ==="
            grep -RIn -C 5 -E "DemoBalance|demo.balance|balanceOverride" "$ROOT" --include='*Tests*.swift' || true
            echo
            echo "=== EXISTING IOS WORKFLOW ==="
            if [ -f "$ROOT/.github/workflows/ios-demo-balance.yml" ]; then
              sed -n '1,260p' "$ROOT/.github/workflows/ios-demo-balance.yml"
            fi
            echo
            echo "=== PROJECT ROOT ==="
            find "$ROOT" -maxdepth 2 -type f | sort | head -200
          } | tee project-inspection.txt

      - name: Upload source and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: ios-source-inspection
          path: |
            project-inspection.txt
            keeper-source.zip
          if-no-files-found: error
