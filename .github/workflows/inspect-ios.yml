name: Inspect iOS project

on:
  push:
    paths:
      - "sources.zip"
      - ".github/workflows/inspect-ios.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and inspect project
        shell: bash
        run: |
          set -euo pipefail
          test -f sources.zip
          mkdir -p extracted
          ditto -x -k sources.zip extracted
          ROOT="$(find extracted -type d -name Keeper -maxdepth 4 | head -1)"
          test -n "$ROOT"
          {
            echo "=== TOOLCHAIN ==="
            xcodebuild -version
            swift --version
            echo
            echo "=== PROJECT ROOT ==="
            echo "$ROOT"
            echo
            for file in AGENTS.md CLAUDE.md README.md Makefile mise.toml; do
              if [ -f "$ROOT/$file" ]; then
                echo "=== $file ==="
                sed -n '1,260p' "$ROOT/$file"
                echo
              fi
            done
            echo "=== EXISTING IOS WORKFLOWS ==="
            find "$ROOT/.github/workflows" -maxdepth 1 -type f -name '*.yml' -o -name '*.yaml' | sort | while read -r file; do
              echo "--- $file"
              sed -n '1,260p' "$file"
            done
            echo
            echo "=== PROJECT AND SCHEMES ==="
            xcodebuild -list -project "$ROOT/Keeper.xcodeproj"
            echo
            echo "=== PROJECT BUILD SETTINGS (APP SCHEMES) ==="
            for scheme in Keeper KeeperDev App; do
              echo "--- scheme: $scheme"
              xcodebuild -showBuildSettings -project "$ROOT/Keeper.xcodeproj" -scheme "$scheme" 2>/dev/null | grep -E '^[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION|PRODUCT_NAME|CODE_SIGN_ENTITLEMENTS|INFOPLIST_FILE|SUPPORTED_PLATFORMS|TARGETED_DEVICE_FAMILY) =' | sort -u || true
            done
            echo
            echo "=== ZIP TOP-LEVEL ==="
            find extracted -maxdepth 2 -type f | sort | head -100
          } | tee project-inspection.txt

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-inspection
          path: project-inspection.txt
          if-no-files-found: error
