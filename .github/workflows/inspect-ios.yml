name: Inspect iOS project

on:
  push:
    paths:
      - "sources.zip"
      - ".github/workflows/inspect-ios.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and inspect project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          ditto -x -k sources.zip extracted
          ROOT="$(find extracted -type d -name Keeper -maxdepth 4 | head -1)"
          test -n "$ROOT"
          {
            echo "=== TOOLCHAIN ==="
            xcodebuild -version
            swift --version
            echo
            echo "=== DEMO BALANCE IMPLEMENTATION SEARCH ==="
            rg -n -i "DemoBalance|demo.balance|balanceOverride|overrideBalance|mockBalance" "$ROOT" --glob '*.swift' --glob '*.yml' --glob '*.yaml' || true
            echo
            echo "=== DEMO BALANCE SOURCE FILES ==="
            find "$ROOT" -type f \( -iname '*DemoBalance*' -o -iname '*Balance*Override*' \) | sort
            while IFS= read -r file; do
              echo
              echo "--- SOURCE: $file"
              sed -n '1,320p' "$file"
            done < <(find "$ROOT" -type f \( -iname '*DemoBalance*' -o -iname '*Balance*Override*' \) | sort)
            echo
            echo "=== APP TESTS MATCHING DEMO BALANCE ==="
            rg -n -C 5 "DemoBalance|demo.balance|balanceOverride" "$ROOT" --glob '*Tests*.swift' || true
            echo
            echo "=== EXISTING IOS WORKFLOW ==="
            if [ -f "$ROOT/.github/workflows/ios-demo-balance.yml" ]; then
              sed -n '1,260p' "$ROOT/.github/workflows/ios-demo-balance.yml"
            fi
            echo
            echo "=== PROJECT AND SCHEMES ==="
            xcodebuild -list -project "$ROOT/Keeper.xcodeproj"
            echo
            echo "=== REPOSITORY ROOT FILES ==="
            find "$ROOT" -maxdepth 2 -type f | sort | head -200
          } | tee project-inspection.txt

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-inspection
          path: project-inspection.txt
          if-no-files-found: error
